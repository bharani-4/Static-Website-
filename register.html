<!DOCTYPE html>
<html>
    <head>
        <title>Register</title>
    </head>
    <style>
        label{
            color:orange;
            font-family: Arial, Helvetica, sans-serif;
            font-size:20px;
        }
    </style>
    <body style="background-color: black;">
        <h2 style="text-align: center;color:orange;"> Register Here</h2>
        <form onsubmit="verify()">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username"style="color:black;"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"style="color:black;"><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password"style="color:black;"><br><br>
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password"style="color:black;"><br><br>
            <input type="submit" value="Register" style="background-color: orange; color: white; border: none; padding: 10px 8px; border-radius: 5px;">
        </form>
        <script>
            function verify() {
                var password = document.getElementById("password").value;
                var confirm_password = document.getElementById("confirm_password").value;
                if (password !== confirm_password) {
                    alert("Passwords do not match!");
                    return false; // Prevent form submission
                }
                alert("Registration successful!");
                return true; // Allow form submission
            }
        </script>
    </body>
</html>
